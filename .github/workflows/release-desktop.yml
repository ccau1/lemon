name: Release Desktop

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-desktop.yml'
      - 'packages/electron/**'
      - 'packages/web/**'
      - 'packages/server/**'
      - 'packages/shared/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      version: ${{ steps.bump.outputs.version }}
      should_release: ${{ steps.bump.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Bump version
        id: bump
        run: |
          latest=$(git tag -l 'desktop-*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            version="0.1.0"
            should_release="true"
          else
            version=${latest#desktop-}
            commits=$(git log "${latest}..HEAD" --pretty=format:%s)
            bump=""
            while IFS= read -r msg; do
              if echo "$msg" | grep -qE '^[a-z]+(\([^)]+\))?!:' || echo "$msg" | grep -qi 'BREAKING CHANGE'; then
                bump="major"
                break
              elif [ -z "$bump" ] && echo "$msg" | grep -qE '^feat(\([^)]+\))?:'; then
                bump="minor"
              elif [ -z "$bump" ] && echo "$msg" | grep -qE '^fix(\([^)]+\))?:'; then
                bump="patch"
              fi
            done <<< "$commits"
            if [ -z "$bump" ]; then
              echo "No conventional commits since ${latest}. Skipping release."
              should_release="false"
            else
              major=$(echo "$version" | cut -d. -f1)
              minor=$(echo "$version" | cut -d. -f2)
              patch=$(echo "$version" | cut -d. -f3)
              case $bump in
                major)
                  major=$((major + 1))
                  minor=0
                  patch=0
                  ;;
                minor)
                  minor=$((minor + 1))
                  patch=0
                  ;;
                patch)
                  patch=$((patch + 1))
                  ;;
              esac
              version="${major}.${minor}.${patch}"
              should_release="true"
            fi
          fi
          new_tag="desktop-${version}"
          echo "new_tag=${new_tag}" >> $GITHUB_OUTPUT
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "should_release=${should_release}" >> $GITHUB_OUTPUT
          echo "Bumping to ${new_tag} (bump: ${bump:-initial})"

  build:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-13
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: corepack enable

      - run: pnpm install

      - run: pnpm --filter @lemon/electron... run build

      - name: Package app
        run: |
          cd packages/electron
          npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - name: Rename artifacts
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          mkdir -p artifacts
          if [ "${{ matrix.platform }}" = "mac" ]; then
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              src="packages/electron/dist-electron/Lemon-${version}-arm64.dmg"
              dest="artifacts/lemon-desktop-${version}-macos-arm64.dmg"
            else
              src="packages/electron/dist-electron/Lemon-${version}.dmg"
              dest="artifacts/lemon-desktop-${version}-macos-x64.dmg"
            fi
          else
            src="packages/electron/dist-electron/Lemon Setup ${version}.exe"
            dest="artifacts/lemon-desktop-${version}-win-x64.exe"
          fi
          mv "$src" "$dest"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/*

  release:
    needs: [version, build]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true

      - name: Create and push tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ needs.version.outputs.new_tag }}
          git push origin ${{ needs.version.outputs.new_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: Desktop ${{ needs.version.outputs.version }}
          body: |
            ## Install

            **macOS (Apple Silicon)**
            Download `lemon-desktop-${{ needs.version.outputs.version }}-macos-arm64.dmg`, open it, and drag Lemon to Applications.

            **macOS (Intel)**
            Download `lemon-desktop-${{ needs.version.outputs.version }}-macos-x64.dmg`, open it, and drag Lemon to Applications.

            **Windows**
            Download `lemon-desktop-${{ needs.version.outputs.version }}-win-x64.exe` and run the installer.
          files: artifacts/*

      - name: Output release URL
        run: |
          url="https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.new_tag }}"
          echo "Release URL: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "$url"
